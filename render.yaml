services:
  - type: web
    name: ablespace-task-manager-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
    # No persistent disk here: Render's free tier doesn't support them.
    # SQLite still works fine on the container's own ephemeral filesystem
    # while it's running (survives idle spin-down/wake-up, which reuses the
    # same container) — it only resets on an actual redeploy, at which point
    # prisma/seed-if-empty.js re-seeds fresh demo data automatically. Add a
    # `disk:` block back (see git history) if you upgrade off the free plan.
